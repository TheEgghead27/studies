name: Build LaTeX document
on:
  push:
    branches:
      - "*"
      - "!master"
  workflow_dispatch:
env:
  course: econ
jobs:
  build_latex:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Git repository
        uses: actions/checkout@v7
      # see https://github.com/digicatapult/vitalam-service-template/pull/5/changes
      - name: Delete latest release
        background: true
        uses: actions/github-script@v9
        with:
          github-token: ${{secrets.GITHUB_TOKEN}}
          script: |
            const { owner, repo } = context.repo
            await github.rest.git.deleteRef({ owner, repo, ref: 'refs/tags/${{ env.course }}}' })
      - name: Compile LaTeX document
        uses: xu-cheng/latex-action@v4
        with:
          root_file: ${{ env.course }}/${{ env.course }}.tex
          latexmk_shell_escape: true
      - name: Wait for jobs to finish
        wait-all:
      - name: Upload PDF to release
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ env.course }}.pdf
          prerelease: true
          tag_name: ${{ env.course }}
          target_commitish: ${{ github.ref }}
